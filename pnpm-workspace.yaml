packages:
  - "apps/*"
  - "packages/cellix/*"
  - "packages/axc/*"
  - "packages/axc-verification/*"

engineStrict: true

# Disable pnpm 11's auto-install on script runs. CI explicitly runs
# `pnpm install --frozen-lockfile` before turbo tasks; concurrent auto-installs
# from parallel turbo workers kill each other with SIGINT (#289).
verifyDepsBeforeRun: false

catalog:
  '@apollo/server': 5.5.0
  '@azure/functions': 4.11.0
  '@cucumber/cucumber': 12.8.1
  '@cucumber/messages': 32.3.1
  '@serenity-js/assertions': 3.46.0
  '@serenity-js/console-reporter': 3.46.0
  '@serenity-js/core': 3.46.0
  '@serenity-js/cucumber': 3.46.0
  '@serenity-js/rest': 3.46.0
  '@serenity-js/serenity-bdd': 3.46.0
  '@storybook/addon-vitest': 10.6.2
  '@types/node': 24.10.1
  '@typescript/native-preview': 7.0.0-dev.20260428.1
  '@vitest/browser-playwright': 4.1.12
  '@vitest/coverage-istanbul': 4.1.12
  archunit: ^2.1.63
  graphql: ^16.10.0
  hono: 4.13.11
  mongodb: 6.18.0
  mongodb-memory-server: ^10.1.4
  mongodb-memory-server-core: 10.1.4
  mongoose: 8.24.1
  playwright: 1.59.0
  react: 19.2.0
  react-dom: 19.2.0
  rimraf: 6.0.1
  tsx: ^4.21.0
  typescript: 6.0.3
  vitest: 4.1.12

auditConfig:
  ignoreGhsas: [
    'GHSA-vfj7-8cjw-p6xm', # braces 3.0.4 is unpublished; latest is 3.0.3 as of 2026-10-21. Recheck by 2026-11-21.
    'GHSA-gcqx-w48m-w2h4', # deepmerge 4.3.2 is unpublished; latest is 4.3.1 as of 2026-11-04. Recheck by 2026-12-04.
    'GHSA-g3hv-75wg-m249' # minimatch 11 breaks archunit 2.5.4's makeRe API; no compatible archunit release as of 2026-11-05. Recheck by 2026-12-05.
  ]

overrides:
  '@graphql-tools/utils': 12.0.2
  '@happy-dom/global-registrator': 21.0.4
  'body-parser@<2.0.0': 1.20.9
  'body-parser@>=2.0.0': 2.4.0
  glob: 14.0.2
  happy-dom: 21.0.4
  joi: 17.13.9
  axios: 1.20.0
  hono: 4.13.11
  fast-uri: 3.1.9
  follow-redirects: 1.16.2
  launch-editor: 2.14.2
  http-cache-semantics: 4.3.0
  postcss-selector-parser: 7.1.6
  serialize-javascript: 7.1.3
  'shell-quote': 1.11.0
  sirv: 3.0.2
  source-map-js: 1.2.2
  tinypool: 2.1.2
  vite: 8.3.3
  vitest: 4.1.12
  '@vitest/browser-playwright': 4.1.12
  '@vitest/mocker': 4.1.12
  '@storybook/addon-vitest': 10.6.2
  storybook: 10.6.2
  smol-toml: 1.9.1
  'sockjs>uuid': 11.1.1
  qs: 6.16.1
  zod: 4.6.6

patchedDependencies:
  '@azure/functions@4.11.0': patches/@azure__functions@4.11.0.patch

allowBuilds:
  '@apollo/protobufjs': false
  core-js: false
  esbuild: false
  mongodb-memory-server: false

minimumReleaseAgeExclude:
  - hono@4.13.11
  - shell-quote@1.11.0
