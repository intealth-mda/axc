packages:
  - "apps/*"
  - "packages/cellix/*"
  - "packages/axc/*"
  - "packages/axc-verification/*"

engineStrict: true

# Disable pnpm 11's auto-install on script runs. CI explicitly runs
# `pnpm install --frozen-lockfile` before turbo tasks; concurrent auto-installs
# from parallel turbo workers kill each other with SIGINT (#289).
verifyDepsBeforeRun: false

catalog:
  '@apollo/server': 5.5.0
  '@azure/functions': 4.11.0
  '@cucumber/cucumber': 12.8.1
  '@cucumber/messages': 32.3.1
  '@serenity-js/assertions': 3.46.0
  '@serenity-js/console-reporter': 3.46.0
  '@serenity-js/core': 3.46.0
  '@serenity-js/cucumber': 3.46.0
  '@serenity-js/rest': 3.46.0
  '@serenity-js/serenity-bdd': 3.46.0
  '@storybook/addon-vitest': ^10.4.2
  # 25.x: happy-dom 21 types use UnderlyingDefaultSource from node:stream/web,
  # first shipped in @types/node 25.0.0.
  '@types/node': 25.9.9
  '@typescript/native-preview': 7.0.0-dev.20260428.1
  '@vitest/browser-playwright': 4.1.12
  '@vitest/coverage-istanbul': 4.1.12
  archunit: ^2.1.63
  graphql: ^16.10.0
  hono: 4.13.14
  mongodb: 6.18.0
  mongodb-memory-server: ^10.1.4
  mongodb-memory-server-core: 10.1.4
  mongoose: 8.24.1
  playwright: 1.59.0
  react: 19.2.0
  react-dom: 19.2.0
  rimraf: 6.0.1
  tsx: ^4.21.0
  typescript: 6.0.3
  vitest: 4.1.12

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 (transitive via knip, ts-scope-trimmer-plugin, Docusaurus):
    # no upstream fix as of 2026-10-03, risk accepted by user.
    # 3.0.4 is listed as patched, but that version is unavailable on the npm
    # registry; latest is 3.0.3. Remove once a patched version ships.
    - GHSA-vfj7-8cjw-p6xm

overrides:
  # happy-dom 21.0.4 is the first release fixing GHSA-834v-8h66-3h79 (no 20.x fix).
  happy-dom: 21.0.4
  '@happy-dom/global-registrator': 21.0.4
  '@graphql-tools/utils@>=10.10.1 <12.0.2': 12.0.4
  '@storybook/addon-vitest': 10.6.5
  storybook: 10.6.5
  axios: 1.20.0
  'body-parser@<1.20.9': 1.20.9
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'follow-redirects@<1.16.2': 1.16.2
  # glob 14 moves to minimatch 11, the first minimatch without SNYK-JS-MINIMATCH-22111072 / GHSA-g3hv-75wg-m249.
  'glob@>=13.0.0 <14.0.2': 14.0.3
  'http-cache-semantics@<4.3.0': 4.3.0
  'joi@>=17.1.1 <17.13.9': 17.13.9
  'launch-editor@<2.14.2': 2.14.2
  # open 11 is the first release fixing SNYK-JS-OPEN-22112123. Storybook and webpack-dev-server load open via ESM import;
  # open 8 (Docusaurus core, CJS require) is left alone because open 11 is ESM-only.
  'open@>=10.0.0 <11.0.0': 11.0.4
  # From origin/main (#14): forced to 7.1.6 for every consumer (supersedes '<6.1.5': 6.1.5).
  postcss-selector-parser: 7.1.6
  'qs@>=6.7.0 <6.16.2': 6.16.2
  'source-map-js@<1.2.2': 1.2.2
  # tinypool 1.x has no fix for GHSA-5gmw-xhrv-c9v3 / GHSA-85c8-ppgw-ccpr; Docusaurus only uses the default Tinypool export.
  'tinypool@<2.1.2': 2.1.2
  'vite@>=8.3.0 <8.3.3': 8.3.5
  'webpack-dev-server@>=5.0.0 <5.2.7': 5.2.7
  'zod@>=4.0.0 <4.6.6': 4.6.7
  hono: 4.13.14
  serialize-javascript: 7.1.4
  'shell-quote': 1.11.0
  sirv: 3.0.2
  vitest: 4.1.12
  '@vitest/browser-playwright': 4.1.12
  '@vitest/mocker': 4.1.12

patchedDependencies:
  '@azure/functions@4.11.0': patches/@azure__functions@4.11.0.patch

allowBuilds:
  '@apollo/protobufjs': false
  core-js: false
  esbuild: false
  mongodb-memory-server: false

minimumReleaseAgeExclude:
  - shell-quote@1.11.0
